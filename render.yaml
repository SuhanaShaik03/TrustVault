services:
  - type: web
    name: trustvault
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --noinput && gunicorn trustvault.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.10
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: trustvault-db
          property: connectionString
      - key: TRUSTED_PROXY_COUNT
        value: "1"

databases:
  - name: trustvault-db
    plan: basic-256mb
    databaseName: trustvault
    user: trustvault
    
