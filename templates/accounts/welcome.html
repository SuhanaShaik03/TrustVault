{% extends "base.html" %}
{% block title %}Welcome · TrustVault{% endblock %}
{% block content %}
  <section class="welcome-page">
    <h1>Welcome to TrustVault</h1>
    <p>Securely manage and share your important documents.</p>
    <a class="button" href="{% url 'accounts:login' %}">Get started</a>
  </section>
  <style>
    main {
      min-height: calc(100vh - 5rem);
      display: grid;
      place-items: center;
      text-align: center;
    }
    .welcome-page {
      width: min(100%, 760px);
      padding: clamp(2rem, 7vw, 4.5rem) 1.5rem;
      border: 1px solid #ffffff50;
      border-radius: 30px;
      background: linear-gradient(135deg, #a63d676b, #5b55ad80);
      box-shadow: 0 24px 70px #10091b59, inset 0 1px #ffffff38;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .welcome-page h1 { color: #fff; text-shadow: 0 2px 18px #120a24a6; font-size: clamp(2rem, 6vw, 3.5rem); margin-bottom: .5rem; }
    .welcome-page p { color: #fff; font-size: 1.15rem; margin-bottom: 1.5rem; }
    .welcome-page .button { padding: .8rem 1.5rem; }
  </style>
{% endblock %}
